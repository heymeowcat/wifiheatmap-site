<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WifiHeatmap">
	<defs>
		<clipPath id="tile">
			<rect x="0" y="0" width="512" height="512" rx="116" ry="116" />
		</clipPath>

		<!-- Heat field: cyan → green → yellow → orange → red, like the app's
		     floorplan coverage map, with the Wi-Fi glyph cut out on top. -->
		<radialGradient id="h-cyan-tl" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#8ceef0" />
			<stop offset="100%" stop-color="#8ceef0" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="h-cyan-br" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#7fe8ee" />
			<stop offset="100%" stop-color="#7fe8ee" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="h-red" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#e2604f" />
			<stop offset="100%" stop-color="#e2604f" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="h-orange" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#f2855a" />
			<stop offset="100%" stop-color="#f2855a" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="h-yellow" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#f0dc52" />
			<stop offset="100%" stop-color="#f0dc52" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="h-green" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#c9e554" />
			<stop offset="100%" stop-color="#c9e554" stop-opacity="0" />
		</radialGradient>
	</defs>

	<g clip-path="url(#tile)">
		<rect width="512" height="512" fill="#cde74f" />
		<ellipse cx="72" cy="58" rx="290" ry="270" fill="url(#h-cyan-tl)" />
		<ellipse cx="446" cy="452" rx="270" ry="250" fill="url(#h-cyan-br)" />
		<ellipse cx="420" cy="92" rx="260" ry="230" fill="url(#h-yellow)" />
		<ellipse cx="238" cy="268" rx="300" ry="290" fill="url(#h-red)" />
		<ellipse cx="118" cy="410" rx="270" ry="250" fill="url(#h-orange)" />
		<ellipse cx="300" cy="140" rx="230" ry="210" fill="url(#h-green)" />

		<!-- Wi-Fi glyph -->
		<g fill="none" stroke="#101418" stroke-linecap="round">
			<path d="M92 246 A 176 176 0 0 1 420 246" stroke-width="58" />
			<path d="M170 330 A 104 104 0 0 1 342 330" stroke-width="58" />
		</g>
		<circle cx="256" cy="418" r="42" fill="#101418" />
	</g>
</svg>
